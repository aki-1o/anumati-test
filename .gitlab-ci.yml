# 1. Base Docker image containing OpenJDK 17 and Maven
image: maven:3.9-eclipse-temurin-17

# 2. Define the pipeline execution stages in sequential order
stages:
  - prepare
  - build
  - test
  - deploy
  - sync_github

# 3. Cache the local Maven repository across builds so we don't re-download dependencies every run
cache:
  key: maven-cache-$CI_COMMIT_REF_SLUG
  paths:
    - .m2/repository

# -------------------------------------------------------------------
# STAGE 1: PREPARE
# -------------------------------------------------------------------
check-environment:
  stage: prepare
  script:
    - echo "=== Verifying Runner Environment ==="
    - java -version
    - mvn -version
    - pwd
    - ls -la

# -------------------------------------------------------------------
# STAGE 2: BUILD
# -------------------------------------------------------------------
compile-and-package:
  stage: build
  script:
    - echo "=== Building Spring Boot Application ==="
    - mvn clean package -DskipTests
  artifacts:
    name: "spring-boot-app-$CI_COMMIT_SHORT_SHA"
    expire_in: 3 days
    paths:
      - target/*.jar

# -------------------------------------------------------------------
# STAGE 3: TEST
# -------------------------------------------------------------------
run-unit-tests:
  stage: test
  cache:
    key: maven-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
    policy: pull  # Only read from cache, don't re-upload
  script:
    - echo "=== Running Unit Tests ==="
    - mvn test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/

# -------------------------------------------------------------------
# STAGE 4: DEPLOY
# -------------------------------------------------------------------
deploy-to-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
  script:
    - echo "=== Deploying to Staging Environment ==="
    - ls -lh target/*.jar
    - echo "App successfully verified and ready for deployment!"
  environment:
    name: staging
    url: https://staging.mycompany.internal
  rules:
    # Only show this job when committed to main, and require a human button click
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

sync_and_create_mr_on_github:
  stage: sync_github
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash curl jq msmtp ca-certificates
  script:
    - echo "=== Step 1:Configuring Identity and Isolation ==="
    - git config --global user.name "Ignosis"
    - git config --global user.email "dev@ignosis.ai"

    # Unique temporary sync branch
    - TARGET_BRANCH="feature/sync-${CI_COMMIT_SHORT_SHA}"
    - 'echo "Isolated target repository: ${GITHUB_OWNER}/${GITHUB_REPO}"'
    - 'echo "Creating sync branch: ${TARGET_BRANCH}"'

    - echo "=== Step 2:Mirroring Branch to GitHub ==="
    - git remote add github https://${GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git || git remote set-url github https://${GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git
    - git push github HEAD:refs/heads/${TARGET_BRANCH} --force

    - echo "=== Step 3:Triggering GitHub REST API for Pull Request ==="
    - |
      PR_RESPONSE=$(curl -s -X POST \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/pulls \
        -d "{
          \"title\": \"[Sync] Updates by ${GITLAB_USER_NAME} (${CI_COMMIT_SHORT_SHA})\",
          \"head\": \"${TARGET_BRANCH}\",
          \"base\": \"develop\",
          \"body\": \"**Developer:** ${GITLAB_USER_NAME}\n**Commit SHA:** ${CI_COMMIT_SHORT_SHA}\n**Project:** ${GITHUB_REPO}\n\nAutomated PR triggered via GitLab CI pipeline.\"
        }")

    - echo "Full API Response:${PR_RESPONSE}"
    - PR_URL=$(echo "$PR_RESPONSE" | jq -r '.html_url // empty')

    - |
      if [ -z "$PR_URL" ]; then
        echo "Failed to create Pull Request. Response from GitHub:"
        echo "$PR_RESPONSE"
        exit 1
      fi
    - echo "Pull Request created successfully at:${PR_URL}"

    - echo "=== Step 4:Configuring SMTP & Broadcasting Email ==="
    - |
      cat <<EOF > /etc/msmtprc
      defaults
      auth           on
      tls            on
      tls_trust_file /etc/ssl/certs/ca-certificates.crt
      logfile        /tmp/msmtp.log
      account        notification
      host           ${SMTP_HOST}
      port           ${SMTP_PORT}
      from           ${SMTP_FROM_EMAIL}
      user           ${SMTP_USER}
      password       ${SMTP_PASSWORD}

      account default : notification
      EOF

    - |
      cat <<EOF | msmtp -v -a default ${RECIPIENT_EMAILS}
      To: ${RECIPIENT_EMAILS}
      From: ${SMTP_FROM_EMAIL}
      Subject: [ PR Created ] ${GITHUB_REPO} - Work by ${GITLAB_USER_NAME}

      MIME-Version: 1.0
      Content-Type: text/html; charset=UTF-8

      <!DOCTYPE html>
      <html>
      <head>
        <style>
          body { font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 20px; margin: 0; }
          .container { background-color: #ffffff; padding: 24px; border-radius: 8px; max-width: 600px; border: 1px solid #e1e4e8; }
          .header { font-size: 18px; font-weight: bold; color: #24292e; margin-bottom: 16px; }
          .details { margin: 16px 0; line-height: 1.6; color: #444444; }
          .btn {
            display: inline-block;
            background-color: #2da44e;
            color: #ffffff !important;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 16px;
          }
          .footer { margin-top: 24px; font-size: 12px; color: #888888; border-top: 1px solid #eee; padding-top: 12px; }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="header">🚀 New Merge Request Created</div>
          <div class="details">
            <p>Hello Team,</p>
            <p>A new Pull Request has been automatically opened on GitHub for <strong>${GITHUB_REPO}</strong> targeting the <code>develop</code> branch.</p>
            <ul>
              <li><strong>Developer:</strong> ${GITLAB_USER_NAME}</li>
              <li><strong>Repository:</strong> ${GITHUB_REPO}</li>
              <li><strong>Commit SHA:</strong> <code>${CI_COMMIT_SHORT_SHA}</code></li>
              <li><strong>Target Branch:</strong> <code>develop</code></li>
            </ul>
            <a href="${PR_URL}" class="btn" target="_blank">Review and Merge PR</a>
          </div>
          <div class="footer">
            Automated Notification | GitLab CI / Ignosis Pipeline
          </div>
        </div>
      </body>
      </html>
      EOF

    - echo "Notification email sent successfully to all team members!"