image: maven:3.9-eclipse-temurin-17

stages:
  - build
  - sync_github
  - send_email_draft

# -------------------------------------------------------------------
# STAGE 1: FAST BUILD
# -------------------------------------------------------------------
compile-and-package:
  stage: build
  script:
    - mvn clean package -DskipTests
  artifacts:
    expire_in: 1 day
    paths:
      - target/*.jar

# -------------------------------------------------------------------
# STAGE 2: GITHUB SYNC (Runs automatically)
# -------------------------------------------------------------------
fast_sync_github:
  stage: sync_github
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash curl jq
  script:
    # 1. Config & Mirroring
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - TARGET_BRANCH="${CI_COMMIT_REF_NAME}"
    - git remote add github https://${GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git || git remote set-url github https://${GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git
    - git push github HEAD:refs/heads/${TARGET_BRANCH} --force

    # 2. GitHub PR API Call
    - |
      PR_RESPONSE=$(curl -s -X POST \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/pulls \
        -d "{
          \"title\": \"[Sync] Updates from ${TARGET_BRANCH} (${CI_COMMIT_SHORT_SHA})\",
          \"head\": \"${TARGET_BRANCH}\",
          \"base\": \"develop\",
          \"body\": \"Automated sync from GitLab CI.\"
        }")

    - PR_URL=$(echo "$PR_RESPONSE" | jq -r '.html_url // empty')

    # Fetch existing PR if creation returned empty
    - |
      if [ -z "$PR_URL" ]; then
        EXISTING_PR=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/pulls?head=${GITHUB_OWNER}:${TARGET_BRANCH}&base=develop")
        PR_URL=$(echo "$EXISTING_PR" | jq -r '.[0].html_url // empty')
      fi

    - echo "Pull Request ready at - ${PR_URL}"

    # Pass PR_URL downstream via dotenv artifact
    - echo "PR_URL=${PR_URL}" > build.env
  artifacts:
    reports:
      dotenv: build.env

# -------------------------------------------------------------------
# STAGE 3: MANUAL ACTION BUTTON (Click Play button in UI to generate link)
# -------------------------------------------------------------------
get_email_draft_link:
  stage: send_email_draft
  image: alpine:latest
  when: manual  # <--- THIS CREATES THE MANUAL PLAY BUTTON IN THE PIPELINE GRAPH
  needs:
    - job: fast_sync_github
      artifacts: true
  before_script:
    - apk add --no-cache python3
  script:
    - |
      python3 -c "
      import urllib.parse, os

      recipients = os.getenv('RECIPIENT_EMAILS', '')
      repo = os.getenv('GITHUB_REPO', '')
      branch = os.getenv('CI_COMMIT_REF_NAME', '')
      user_name = os.getenv('GITLAB_USER_NAME', '')
      user_email = os.getenv('GITLAB_USER_EMAIL', '')
      sha = os.getenv('CI_COMMIT_SHORT_SHA', '')
      pr_url = '${PR_URL}'

      subject = f'[PR Sync] {repo} - {branch} by {user_name}'
      body = f'Hi Team,\n\nA new PR targeting develop was created for {repo}.\n\nDeveloper: {user_name} ({user_email})\nBranch: {branch}\nCommit: {sha}\n\nPR Link:\n{pr_url}'

      encoded_to = urllib.parse.quote(recipients)
      encoded_su = urllib.parse.quote(subject)
      encoded_body = urllib.parse.quote(body)

      gmail_url = f'https://mail.google.com/mail/?view=cm&fs=1&to={encoded_to}&su={encoded_su}&body={encoded_body}'

      print('\n==========================================================================')
      print(f'  EMAIL DRAFT READY FOR USER - {user_name} ({user_email})')
      print('==========================================================================')
      print('  Ctrl + Click (or Cmd + Click on Mac) to open pre-filled Gmail draft in NEW TAB:')
      print(f'  {gmail_url}')
      print('==========================================================================\n')
      "