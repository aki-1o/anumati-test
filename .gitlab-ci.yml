# 1. Base Docker image containing OpenJDK 17 and Maven
image: maven:3.9-eclipse-temurin-17

# 2. Define the pipeline execution stages in sequential order
stages:
  - prepare
  - build
  - test
  - deploy
  - sync_github

# 3. Cache the local Maven repository across builds so we don't re-download dependencies every run
cache:
  key: maven-cache-$CI_COMMIT_REF_SLUG
  paths:
    - .m2/repository

# -------------------------------------------------------------------
# STAGE 1: PREPARE
# -------------------------------------------------------------------
check-environment:
  stage: prepare
  script:
    - echo "=== Verifying Runner Environment ==="
    - java -version
    - mvn -version
    - pwd
    - ls -la

# -------------------------------------------------------------------
# STAGE 2: BUILD
# -------------------------------------------------------------------
compile-and-package:
  stage: build
  script:
    - echo "=== Building Spring Boot Application ==="
    - mvn clean package -DskipTests
  artifacts:
    name: "spring-boot-app-$CI_COMMIT_SHORT_SHA"
    expire_in: 3 days
    paths:
      - target/*.jar

# -------------------------------------------------------------------
# STAGE 3: TEST
# -------------------------------------------------------------------
run-unit-tests:
  stage: test
  cache:
    key: maven-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
    policy: pull  # Only read from cache, don't re-upload
  script:
    - echo "=== Running Unit Tests ==="
    - mvn test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/

# -------------------------------------------------------------------
# STAGE 4: DEPLOY
# -------------------------------------------------------------------
deploy-to-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
  script:
    - echo "=== Deploying to Staging Environment ==="
    - ls -lh target/*.jar
    - echo "App successfully verified and ready for deployment!"
  environment:
    name: staging
    url: https://staging.mycompany.internal
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

# -------------------------------------------------------------------
# STAGE 5: SYNC TO GITHUB & BROADCAST NOTIFICATION
# -------------------------------------------------------------------
sync_and_create_mr_on_github:
  stage: sync_github
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash curl jq msmtp ca-certificates
  script:
    - echo "=== Step 1: Configuring Identity and Isolation ==="
    - git config --global user.name "Ignosis"
    - git config --global user.email "dev@ignosis.ai"

    # Match target GitHub branch to current GitLab branch name
    - TARGET_BRANCH="${CI_COMMIT_REF_NAME}"
    - 'echo "Isolated target repository: ${GITHUB_OWNER}/${GITHUB_REPO}"'
    - 'echo "Syncing branch: ${TARGET_BRANCH}"'

    - echo "=== Step 2: Mirroring Branch to GitHub ==="
    - git remote add github https://${GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git || git remote set-url github https://${GITHUB_TOKEN}@github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git
    - git push github HEAD:refs/heads/${TARGET_BRANCH} --force

    - echo "=== Step 3: Triggering GitHub REST API for Pull Request ==="
    - |
      PR_RESPONSE=$(curl -s -X POST \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/pulls \
        -d "{
          \"title\": \"[Sync] Updates from ${TARGET_BRANCH} (${CI_COMMIT_SHORT_SHA})\",
          \"head\": \"${TARGET_BRANCH}\",
          \"base\": \"develop\",
          \"body\": \"**Developer:** ${GITLAB_USER_NAME}\n**Source Branch:** ${TARGET_BRANCH}\n**Commit SHA:** ${CI_COMMIT_SHORT_SHA}\n\nAutomated sync from GitLab CI.\"
        }")

    - echo "Full API Response: ${PR_RESPONSE}"

    # Try extracting PR URL from creation response
    - PR_URL=$(echo "$PR_RESPONSE" | jq -r '.html_url // empty')

    # Fallback to fetching existing PR URL if it already exists
    - |
      if [ -z "$PR_URL" ]; then
        echo "Checking if Pull Request already exists..."
        EXISTING_PR=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/pulls?head=${GITHUB_OWNER}:${TARGET_BRANCH}&base=develop")
        PR_URL=$(echo "$EXISTING_PR" | jq -r '.[0].html_url // empty')
      fi

    - |
      if [ -z "$PR_URL" ]; then
        echo "Could not resolve or create Pull Request."
        exit 1
      fi

    - echo "Pull Request ready at: ${PR_URL}"

    - echo "=== Step 4: Configuring SMTP & Broadcasting Plaintext Email ==="
    - |
      cat <<EOF > /etc/msmtprc
      defaults
      auth           on
      tls            on
      tls_trust_file /etc/ssl/certs/ca-certificates.crt
      logfile        /tmp/msmtp.log
      account        notification
      host           ${SMTP_HOST}
      port           ${SMTP_PORT}
      from           ${SMTP_FROM_EMAIL}
      user           ${SMTP_USER}
      password       ${SMTP_PASSWORD}

      account default : notification
      EOF

    - |
      cat <<EOF | msmtp -v -a default ${RECIPIENT_EMAILS}
      To: ${RECIPIENT_EMAILS}
      From: ${SMTP_FROM_EMAIL}
      Subject: [ PR Updated ] ${GITHUB_REPO} (${TARGET_BRANCH}) - Work by ${GITLAB_USER_NAME}

      Hello Team,

      A Pull Request targeting 'develop' has been synced on GitHub for repository '${GITHUB_REPO}'.

      • Developer: ${GITLAB_USER_NAME}
      • Repository: ${GITHUB_REPO}
      • Branch: ${TARGET_BRANCH}
      • Commit SHA: ${CI_COMMIT_SHORT_SHA}

      Review and Merge PR here:
      ${PR_URL}

      --
      Automated Notification | GitLab CI / Ignosis Pipeline
      EOF

    - echo "Plain text notification email sent successfully!"